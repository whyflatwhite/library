[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.coverage.run]
source = ["app", "scripts"]
branch = false

[tool.coverage.report]
# Порог можно только повышать, снижать нельзя (см. docs/CONTRIBUTING.md)
fail_under = 70
show_missing = true

[tool.bandit]
exclude_dirs = ["tests", "migrations", ".venv"]
