<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Библиотека</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F7F2EA;
    --surface: #FFFDF9;
    --ink: #2E1B22;
    --muted: #8A7B6C;
    --primary: #5C2A3A;
    --primary-hover: #4A2130;
    --accent: #A97C50;
    --border: #E3D9CB;
    --danger: #A8402A;
  }

  * { box-sizing: border-box; }

  body {
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    max-width: 760px;
    margin: 0 auto;
    padding: 48px 24px 80px;
    line-height: 1.5;
  }

  .brand {
    font-family: "Fraunces", serif;
    font-size: 28px;
    font-weight: 600;
    letter-spacing: 0.01em;
    margin: 0 0 4px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .brand svg { flex-shrink: 0; }

  .tagline {
    color: var(--muted);
    font-size: 14px;
    margin: 0 0 36px;
  }

  /* ---------- Экран входа/регистрации ---------- */

  .auth-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    max-width: 380px;
    margin: 40px auto 0;
    padding: 32px;
  }

  .auth-switch {
    display: flex;
    gap: 24px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 24px;
  }

  .auth-switch button {
    background: none;
    border: none;
    padding: 0 0 12px;
    font-size: 15px;
    font-family: "Fraunces", serif;
    color: var(--muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
  }

  .auth-switch button.active {
    color: var(--primary);
    border-bottom-color: var(--primary);
  }

  .auth-panel { display: none; }
  .auth-panel.active { display: block; }

  label {
    display: block;
    font-size: 13px;
    color: var(--muted);
    margin: 14px 0 4px;
  }

  input[type="text"], input[type="password"], input[type="number"] {
    width: 100%;
    padding: 9px 10px;
    border: 1px solid var(--border);
    border-radius: 3px;
    background: var(--surface);
    color: var(--ink);
    font-size: 14px;
    font-family: inherit;
  }

  input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(169, 124, 80, 0.15);
  }

  button.primary {
    width: 100%;
    margin-top: 20px;
    padding: 10px 16px;
    background: var(--primary);
    color: var(--surface);
    border: none;
    border-radius: 3px;
    font-size: 14px;
    cursor: pointer;
  }

  button.primary:hover { background: var(--primary-hover); }

  #error {
    color: var(--danger);
    font-size: 13px;
    min-height: 18px;
    margin-top: 14px;
  }

  /* ---------- Основной экран ---------- */

  #app { display: none; }

  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    border-bottom: 1px solid var(--border);
    padding-bottom: 16px;
    margin-bottom: 20px;
  }

  .topbar .greeting { font-size: 14px; color: var(--muted); }
  .topbar .greeting strong { color: var(--ink); font-weight: 600; }

  .link-button {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 13px;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  .link-button:hover { color: var(--ink); }

  .tabs {
    display: flex;
    gap: 22px;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--border);
    padding-bottom: 0;
  }

  .tabs button {
    background: none;
    border: none;
    padding: 0 0 10px;
    font-size: 14px;
    color: var(--muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
  }

  .tabs button.active {
    color: var(--primary);
    border-bottom-color: var(--accent);
  }

  .toolbar {
    display: flex;
    justify-content: flex-end;
    margin-top: 16px;
  }

  #toggle-add-btn {
    background: none;
    border: 1px solid var(--primary);
    color: var(--primary);
    padding: 6px 14px;
    border-radius: 3px;
    font-size: 13px;
    cursor: pointer;
  }
  #toggle-add-btn:hover { background: var(--primary); color: var(--surface); }

  .add-box {
    display: none;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 18px;
    margin-top: 12px;
  }
  .add-box.open { display: block; }

  .add-box input { margin-bottom: 10px; }

  .add-error { color: var(--danger); font-size: 13px; margin: 4px 0 0; }

  .add-box button.primary { width: auto; padding: 8px 20px; }

  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 24px;
    font-size: 14px;
  }

  th {
    text-align: left;
    font-weight: 500;
    color: var(--muted);
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
  }

  td {
    padding: 9px 10px;
    border-bottom: 1px solid var(--border);
  }

  tbody tr:hover { background: rgba(169, 124, 80, 0.06); }

  td button {
    background: none;
    border: 1px solid var(--border);
    color: var(--primary);
    padding: 4px 10px;
    border-radius: 3px;
    font-size: 12px;
    cursor: pointer;
  }
  td button:hover { border-color: var(--primary); }
</style>
</head>
<body>

<div id="auth">
  <h1 class="brand">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5C2A3A" stroke-width="1.6">
      <path d="M4 19.5V5a2 2 0 0 1 2-2h12.5v15H6a2 2 0 0 0-2 2Zm0 0a2 2 0 0 0 2 2h12.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    Библиотека
  </h1>
  

  <div class="auth-card">
    <div class="auth-switch">
      <button id="switch-login" class="active" onclick="showAuthPanel('login')">Вход</button>
      <button id="switch-register" onclick="showAuthPanel('register')">Регистрация</button>
    </div>

    <div id="panel-login" class="auth-panel active">
      <label for="login-username">Логин</label>
      <input id="login-username" type="text">
      <label for="login-password">Пароль</label>
      <input id="login-password" type="password">
      <button class="primary" onclick="login()">Войти</button>
    </div>

    <div id="panel-register" class="auth-panel">
      <label for="reg-username">Логин</label>
      <input id="reg-username" type="text">
      <label for="reg-password">Пароль</label>
      <input id="reg-password" type="password">
      <button class="primary" onclick="register()">Зарегистрироваться</button>
    </div>

    <p id="error"></p>
  </div>
</div>

<div id="app">
  <div class="topbar">
    <h1 class="brand" style="font-size: 20px; margin: 0;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5C2A3A" stroke-width="1.6">
        <path d="M4 19.5V5a2 2 0 0 1 2-2h12.5v15H6a2 2 0 0 0-2 2Zm0 0a2 2 0 0 0 2 2h12.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Библиотека
    </h1>
    <span class="greeting">Вы вошли как <strong id="whoami"></strong> · <button class="link-button" onclick="logout()">Выйти</button></span>
  </div>

  <div class="tabs" id="tabs"></div>
  <div class="toolbar">
    <button id="toggle-add-btn" onclick="toggleAddForm()">+ Добавить</button>
  </div>
  <div class="add-box" id="add-box">
    <div id="add-fields"></div>
    <p class="add-error" id="add-error"></p>
    <button class="primary" onclick="submitAdd()">Сохранить</button>
  </div>
  <table id="data-table">
    <thead><tr id="table-head"></tr></thead>
    <tbody id="table-body"></tbody>
  </table>
</div>

<script>
const API = "";

const CATEGORIES = {
  "Авторы": {
    url: "/authors",
    columns: ["id", "full_name", "bio"],
    fields: [
      { name: "full_name", label: "Имя автора", type: "text", required: true },
      { name: "bio", label: "Биография", type: "text", required: false }
    ]
  },
  "Факультеты": {
    url: "/faculties",
    columns: ["id", "name"],
    fields: [
      { name: "name", label: "Название факультета", type: "text", required: true }
    ]
  },
  "Филиалы": {
    url: "/branches",
    columns: ["id", "name", "address"],
    fields: [
      { name: "name", label: "Название филиала", type: "text", required: true },
      { name: "address", label: "Адрес", type: "text", required: false }
    ]
  },
  "Книги": {
    url: "/books",
    columns: ["id", "title", "author_id", "faculty_id", "published_year"],
    fields: [
      { name: "title", label: "Название книги", type: "text", required: true },
      { name: "author_id", label: "ID автора", type: "number", required: true },
      { name: "faculty_id", label: "ID факультета (необязательно)", type: "number", required: false },
      { name: "isbn", label: "ISBN (необязательно)", type: "text", required: false },
      { name: "published_year", label: "Год издания (необязательно)", type: "number", required: false }
    ]
  },
  "Экземпляры": {
    url: "/copies",
    columns: ["id", "inventory_number", "status", "book_id", "branch_id"],
    fields: [
      { name: "inventory_number", label: "Инвентарный номер", type: "text", required: true },
      { name: "book_id", label: "ID книги", type: "number", required: true },
      { name: "branch_id", label: "ID филиала", type: "number", required: true }
    ]
  },
  "Выдачи": {
    url: "/loans",
    columns: ["id", "copy_id", "borrower_name", "issued_at", "returned_at"],
    fields: [
      { name: "copy_id", label: "ID экземпляра", type: "number", required: true },
      { name: "borrower_name", label: "Имя читателя", type: "text", required: true }
    ],
    hasReturnAction: true
  }
};

let currentCategoryName = null;

function showAuthPanel(which) {
  document.getElementById("switch-login").classList.toggle("active", which === "login");
  document.getElementById("switch-register").classList.toggle("active", which === "register");
  document.getElementById("panel-login").classList.toggle("active", which === "login");
  document.getElementById("panel-register").classList.toggle("active", which === "register");
  document.getElementById("error").innerText = "";
}

function showError(msg) {
  document.getElementById("error").innerText = msg;
}

async function register() {
  const username = document.getElementById("reg-username").value;
  const password = document.getElementById("reg-password").value;
  const res = await fetch(API + "/auth/register", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({username, password})
  });
  if (res.ok) {
    showAuthPanel("login");
    showError("Регистрация успешна, теперь войдите.");
  } else {
    const data = await res.json();
    showError(data.detail || "Ошибка регистрации");
  }
}

async function login() {
  const username = document.getElementById("login-username").value;
  const password = document.getElementById("login-password").value;
  const res = await fetch(API + "/auth/login", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({username, password})
  });
  if (res.ok) {
    const data = await res.json();
    localStorage.setItem("token", data.access_token);
    await showApp();
  } else {
    const data = await res.json();
    showError(data.detail || "Ошибка входа");
  }
}

async function showApp() {
  const token = localStorage.getItem("token");
  if (!token) return;
  const res = await fetch(API + "/auth/me", {
    headers: {"Authorization": "Bearer " + token}
  });
  if (res.ok) {
    const user = await res.json();
    document.getElementById("whoami").innerText = user.username;
    document.getElementById("auth").style.display = "none";
    document.getElementById("app").style.display = "block";
    buildTabs();
  } else {
    localStorage.removeItem("token");
  }
}

function buildTabs() {
  const tabsDiv = document.getElementById("tabs");
  tabsDiv.innerHTML = "";
  const names = Object.keys(CATEGORIES);
  names.forEach((name, index) => {
    const btn = document.createElement("button");
    btn.innerText = name;
    btn.onclick = () => selectCategory(name, btn);
    if (index === 0) btn.classList.add("active");
    tabsDiv.appendChild(btn);
  });
  selectCategory(names[0], tabsDiv.children[0]);
}

async function selectCategory(name, btnEl) {
  document.querySelectorAll(".tabs button").forEach(b => b.classList.remove("active"));
  btnEl.classList.add("active");
  currentCategoryName = name;

  document.getElementById("add-box").classList.remove("open");
  document.getElementById("add-error").innerText = "";
  buildAddForm(name);

  const category = CATEGORIES[name];
  const res = await fetch(API + category.url);
  const rows = res.ok ? await res.json() : [];

  const headRow = document.getElementById("table-head");
  headRow.innerHTML = category.columns.map(c => `<th>${c}</th>`).join("")
    + (category.hasReturnAction ? "<th>Действие</th>" : "");

  const body = document.getElementById("table-body");
  body.innerHTML = rows.map(row => {
    let cells = category.columns.map(c => `<td>${row[c] ?? ""}</td>`).join("");
    if (category.hasReturnAction) {
      cells += row.returned_at
        ? "<td>—</td>"
        : `<td><button onclick="returnLoan(${row.id})">Вернуть</button></td>`;
    }
    return "<tr>" + cells + "</tr>";
  }).join("");
}

async function returnLoan(loanId) {
  const token = localStorage.getItem("token");
  const res = await fetch(API + `/loans/${loanId}/return`, {
    method: "POST",
    headers: { "Authorization": "Bearer " + token }
  });
  if (res.ok) {
    const tabsDiv = document.getElementById("tabs");
    const activeBtn = [...tabsDiv.children].find(b => b.classList.contains("active"));
    selectCategory(currentCategoryName, activeBtn);
  } else {
    const data = await res.json();
    alert(data.detail || "Не удалось оформить возврат");
  }
}

function buildAddForm(name) {
  const category = CATEGORIES[name];
  const container = document.getElementById("add-fields");
  container.innerHTML = category.fields.map(f =>
    `<input id="add-field-${f.name}" type="${f.type}" placeholder="${f.label}${f.required ? " *" : ""}">`
  ).join("");
}

function toggleAddForm() {
  document.getElementById("add-box").classList.toggle("open");
}

async function submitAdd() {
  const category = CATEGORIES[currentCategoryName];
  const errorEl = document.getElementById("add-error");
  errorEl.innerText = "";

  const payload = {};
  for (const f of category.fields) {
    const raw = document.getElementById(`add-field-${f.name}`).value;
    if (raw === "") {
      if (f.required) {
        errorEl.innerText = `Поле "${f.label}" обязательно`;
        return;
      }
      continue;
    }
    payload[f.name] = f.type === "number" ? Number(raw) : raw;
  }

  const token = localStorage.getItem("token");
  const res = await fetch(API + category.url, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": "Bearer " + token
    },
    body: JSON.stringify(payload)
  });

  if (res.ok) {
    document.getElementById("add-box").classList.remove("open");
    for (const f of category.fields) {
      document.getElementById(`add-field-${f.name}`).value = "";
    }
    const tabsDiv = document.getElementById("tabs");
    const activeBtn = [...tabsDiv.children].find(b => b.classList.contains("active"));
    selectCategory(currentCategoryName, activeBtn);
  } else {
    const data = await res.json();
    errorEl.innerText = data.detail ? JSON.stringify(data.detail) : "Ошибка сохранения";
  }
}

function logout() {
  localStorage.removeItem("token");
  document.getElementById("auth").style.display = "block";
  document.getElementById("app").style.display = "none";
}

showApp();
</script>

</body>
</html>
