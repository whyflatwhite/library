name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint & static analysis (make quality)
        run: |
          black --check app tests
          isort --check-only app tests
          flake8 app tests
          mypy app

      - name: Run tests (make test)
        run: pytest -v --cov=app --cov-report=term-missing

  build-image:
    runs-on: ubuntu-latest
    needs: quality-and-tests
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t library-api:${{ github.sha }} .

  migration-check:
    runs-on: ubuntu-latest
    needs: quality-and-tests
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: library_user
          POSTGRES_PASSWORD: library_pass
          POSTGRES_DB: library
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U library_user -d library"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Apply migrations against a clean database
        env:
          DATABASE_URL: postgresql+psycopg://library_user:library_pass@localhost:5432/library
        run: alembic upgrade head
